[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-loader"
version = "0.1.0"
description = "一个支持直链、HLS、片段列表和 JPEG 图片序列的现代桌面下载工具。"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "customtkinter>=5.2.2,<6",
    "requests>=2.31,<3",
]

[project.scripts]
video-loader = "video_loader.app:main"

[tool.setuptools.packages.find]
where = ["src"]
