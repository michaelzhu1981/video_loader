[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-loader"
version = "0.1.0"
description = "一个支持直链、HLS、片段列表、JPEG 图片序列、磁力链接和网页嗅探的现代桌面下载工具。"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "customtkinter>=5.2.2,<6",
    "requests>=2.31,<3",
    # 浏览器指纹伪装：Cloudflare 等按 TLS/HTTP2 指纹拦截的站点（requests 会被 403）。
    "curl-cffi>=0.7,<1",
    # 网页嗅探的浏览器抓包（Chrome DevTools 协议）。
    "websocket-client>=1.7,<2",
]

[project.scripts]
video-loader = "video_loader.app:main"

[tool.setuptools.packages.find]
where = ["src"]
